name: room

# Start a room run from GitHub, no PC needed:
#  - comment on the "Room inbox" issue:  /room [goal=..] [rounds=1-3] [agents=..] <instruction>
#  - or Actions tab > room > Run workflow
on:
  workflow_dispatch:
    inputs:
      goal:
        description: Goal folder name (blank = ACTIVE_GOAL)
        required: false
        default: ''
      instruction:
        description: What should the agents do?
        required: false
        default: Continue the active goal.
      rounds:
        description: Rounds (each round, all agents run in parallel, then see each other's work)
        type: choice
        options: ['1', '2', '3']
        default: '2'
      agents:
        description: all, or a comma list such as claude,gemini
        required: false
        default: all
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: room
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.title == 'Room inbox' &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, '/room'))
    runs-on: ubuntu-latest
    outputs:
      goal: ${{ steps.p.outputs.goal }}
      rounds: ${{ steps.p.outputs.rounds }}
      agents: ${{ steps.p.outputs.agents }}
      instruction: ${{ steps.p.outputs.instruction }}
      start: ${{ steps.p.outputs.start }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse command
        id: p
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IN_GOAL: ${{ inputs.goal }}
          IN_ROUNDS: ${{ inputs.rounds }}
          IN_AGENTS: ${{ inputs.agents }}
          IN_INSTRUCTION: ${{ inputs.instruction }}
        run: node scripts/parse-command.mjs

  round1:
    needs: prepare
    uses: ./.github/workflows/agent-round.yml
    secrets: inherit
    with:
      goal: ${{ needs.prepare.outputs.goal }}
      instruction: ${{ needs.prepare.outputs.instruction }}
      round: '1'
      total_rounds: ${{ needs.prepare.outputs.rounds }}
      agents: ${{ needs.prepare.outputs.agents }}

  round2:
    needs: [prepare, round1]
    if: ${{ !cancelled() && needs.round1.result == 'success' && needs.prepare.outputs.rounds >= 2 }}
    uses: ./.github/workflows/agent-round.yml
    secrets: inherit
    with:
      goal: ${{ needs.prepare.outputs.goal }}
      instruction: ${{ needs.prepare.outputs.instruction }}
      round: '2'
      total_rounds: ${{ needs.prepare.outputs.rounds }}
      agents: ${{ needs.prepare.outputs.agents }}

  round3:
    needs: [prepare, round2]
    if: ${{ !cancelled() && needs.round2.result == 'success' && needs.prepare.outputs.rounds >= 3 }}
    uses: ./.github/workflows/agent-round.yml
    secrets: inherit
    with:
      goal: ${{ needs.prepare.outputs.goal }}
      instruction: ${{ needs.prepare.outputs.instruction }}
      round: '3'
      total_rounds: ${{ needs.prepare.outputs.rounds }}
      agents: ${{ needs.prepare.outputs.agents }}

  report:
    needs: [prepare, round1, round2, round3]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post summary to the Room inbox
        env:
          GH_TOKEN: ${{ github.token }}
          GOAL: ${{ needs.prepare.outputs.goal }}
          START: ${{ needs.prepare.outputs.start }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/summary.mjs > summary.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Room inbox in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file summary.md; else cat summary.md; fi
