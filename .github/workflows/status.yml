name: Room status
on:
  push:
    branches: [main]
    paths: ['goals/**', 'scripts/**', 'ACTIVE_GOAL', '.github/workflows/status.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/status.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: room-status-${{ github.ref }}
  cancel-in-progress: true
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate participant tooling
        run: |
          node scripts/participants.test.mjs
          node --check scripts/room.mjs
          node --check scripts/claims.mjs
          node --check scripts/summary.mjs
          node --check scripts/parse-command.mjs
      - name: Publish snapshot to run summary
        run: |
          goal=$(cat ACTIVE_GOAL)
          if [[ ! "$goal" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then exit 1; fi
          if [ -d "goals/$goal/claims" ]; then
            node scripts/claims.mjs "$goal" --stdout >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/room.mjs status --goal "$goal"
            cat "goals/$goal/STATUS.md" >> "$GITHUB_STEP_SUMMARY"
          fi
